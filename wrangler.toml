name = "intervals-icu-netlify"
# Explizit aktivieren: Service ist unter <name>.<account-subdomain>.workers.dev erreichbar.
main = "src/index.js"
compatibility_date = "2025-11-11"
workers_dev = true

# Erster Eintrag: alle 15 Minuten (UTC 05:00-22:45, deckt 07:00-23:45 Berlin in Sommer- und
# Winterzeit ab). Jeder Tick synct Yazio fuer heute (Ernaehrung ueber den Tag verfolgen)
# und holt die Snapshots aus GitHub (index.js).
# Zweiter Eintrag: Minute 58 in den UTC-Stunden 21 und 22, damit einer der beiden Ticks
# unabhaengig von Sommer-/Winterzeit auf 23:58 Berlin faellt: letzter Yazio-Sync des Tages.
triggers = { crons = ["*/15 5-22 * * *", "58 21-22 * * *"] }

[[kv_namespaces]]
binding = "KV"
id = "95402760eee9445fa98df09aad54cdfc"
preview_id = "95402760eee9445fa98df09aad54cdfc"

# Statische Dashboard-Seite unter /dashboard/ (kein Build-Schritt). Daten kommen von /api/dashboard.
[assets]
directory = "./public"

# Optionale Worker-Variablen fürs Widget (im Dashboard unter Settings > Variables setzen, nicht hier):
#   WEEKLY_TSS_GOAL   Wochenziel der TSS, falls im Intervals-Kalender keine Workouts mit Load stehen
#   TRI_SPLIT_TARGET  Soll der Zeitverteilung Schwimmen,Rad,Lauf in Prozent, z. B. "20,45,35"
#                     (Widget-Parameter "training"); ohne Wert zeigt das Widget kein Soll
#
# EGYM (Kraft-Daten, inoffizielle Netpulse-API, siehe src/egym-client.js) - als Secrets setzen:
#   EGYM_USERNAME, EGYM_PASSWORD   Login der EGYM-App
#   EGYM_BRAND (optional)          Studio-Kennung (Host <brand>.netpulse.com); ohne Wert wird der Host aus der E-Mail ermittelt
#   EGYM_WEEKLY_GOAL_SETS (optional) Wochenziel Krafttraining in Saetzen (Kraft-Widget, Parameter "kraft", und Dashboard); ohne Wert 60
